apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: mainmanager-api-dependabot
  namespace: team-oebs
  labels:
    team: team-oebs

spec:
  image: {{ image }}
  port: 8080

  ttl: 6m

  replicas:
    min: 1
    max: 1

  resources:
    requests:
      cpu: 10m
      memory: 448Mi
    limits:
      memory: 512Mi

  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no

  envFrom:
    - secret: dependabot-oebs-t1
    - secret: mainmanager-api-dependabot-oracle

  accessPolicy:
    inbound:
      rules: [ ]
    outbound:
      external: [ ]

  prometheus:
    enabled: true
    path: /actuator/prometheus

  ingresses:
     - "https://mainmanager-api-dependabot.intern.dev.nav.no"
