name: Deploy alerts to NAIS for personhendelse-consumer-oebs
on:
  push:
    branches:
      - main
    paths:
      - .nais/alertconfig-dev.yaml
      - .nais/prometheusrule-dev.yaml
      - .nais/alertconfig.yaml
      - .nais/prometheusrule.yaml
      - .github/workflows/deploy-alerts.yaml

jobs:
  changes:
    name: Detect changed alert files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            dev:
              - '.nais/alertconfig-dev.yaml'
              - '.nais/prometheusrule-dev.yaml'
            prod:
              - '.nais/alertconfig.yaml'
              - '.nais/prometheusrule.yaml'

  deploy-dev:
    name: Deploy alerts to dev-gcp
    needs: changes
    if: needs.changes.outputs.dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy alerts to dev-gcp
        uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/alertconfig-dev.yaml,.nais/prometheusrule-dev.yaml

  deploy-prod:
    name: Deploy alerts to prod-gcp
    needs: changes
    if: needs.changes.outputs.prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy alerts to prod-gcp
        uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/alertconfig.yaml,.nais/prometheusrule.yaml
