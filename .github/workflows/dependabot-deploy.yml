name: Dependabot deploy verification

on:
  pull_request:
    branches:
      - main

concurrency:
  group: dependabot-deploy
  cancel-in-progress: false

jobs:
  verify-deploy:
    name: Verify dependabot deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip for non-dependabot PRs
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "Not a dependabot PR, skipping deploy verification"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event.pull_request.user.login == 'dependabot[bot]'

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: app-token
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mvn -B verify -Pcoverage

      - name: Push Docker image to GAR
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795
        id: docker-build-push
        with:
          team: team-oebs

      - name: Deploy to dedicated dependabot workload
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app-dependabot.yaml
          VAR: image=${{ steps.docker-build-push.outputs.image }}
