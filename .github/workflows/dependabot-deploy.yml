name: Dependabot deploy verification

on:
  pull_request:
    branches:
      - main

concurrency:
  group: dependabot-deploy
  cancel-in-progress: false

jobs:
  verify-deploy:
    name: Verify dependabot deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip for non-dependabot PRs
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "Not a dependabot PR, skipping deploy verification"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event.pull_request.user.login == 'dependabot[bot]'

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: app-token
        with:
          app-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mvn -B verify -Pcoverage

      - name: Push Docker image to GAR
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1
        id: docker-build-push
        with:
          team: team-oebs

      - name: Deploy to dedicated dependabot workload
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app-dependabot.yaml
          VAR: image=${{ steps.docker-build-push.outputs.image }}
